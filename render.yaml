services:
  - type: web
    name: fashionhub
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_ORIGINS
        sync: false
